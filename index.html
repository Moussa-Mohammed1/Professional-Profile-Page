<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <title>Page profil professionnel</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    </head>
    <body>
        <div class="profil-card">
            <div class="info-section">
                <div class="profile-img">
                    <img src="images/profile.jpg" alt="Moussa Mohammed">
                </div>
                <div class="profile-info">
                    <h2 id="name">Moussa Mohammed</h2>
                    <p id="job">Full Stack Developer</p>
                    <p id="location"><i class="fa-solid fa-location-dot"></i>Safi • Youcode School</p>
                </div>
                <button id="contact-btn"> Exchange Contact</button>
            </div>
            <div class="social-section">
                <div class="social-header">
                    <h3>LET'S CONNECT</h3>
                </div>
                <div class="social-platforms">
                    <a href="#" id="instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" id="linkedin"><i class="fa-brands fa-linkedin"></i></a>
                </div>
            </div>
            <div class="team-section">
                <h3>OUR TEAM</h3>
            <div class="team-grid">
                <div class="member">

                        <img src="images/member1.jpeg" alt="">
                    
                    <h4>Jack</h4>
                    <p class="member-role">Account Executive</p>
                </div>
                <div class="member">

                        <img src="images/member2.jpeg" alt="">
                    
                    <h4>Rafaeal</h4>
                    <p class="member-role">Marketing Director</p>
                </div>
                <div class="member">
                    
                        <img src="images/member3.jpeg" alt="">
                  
                    <h4>Celine</h4>
                    <p class="member-role">Marketing Ops</p>
                </div>
            </div>
            </div>
        </div>
    </body>
</html>
